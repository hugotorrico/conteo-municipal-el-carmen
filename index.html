<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conteo Municipal El Carmen</title>
<style>
:root{--b:#123a70;--m:#2f6fb7;--bg:#f4f7fb;--line:#d9e3ef;--txt:#17365d;--muted:#6b7a90;--ok:#198754;--warn:#b66a00;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#0d3567,#174e8d);color:#fff;padding:14px 18px;box-shadow:0 2px 12px #0002}
.wrap{max-width:1600px;margin:auto}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{flex:1}.brand b{font-size:19px}.brand small{display:block;opacity:.75}
nav{display:flex;gap:6px;flex-wrap:wrap}button{cursor:pointer}nav button,.top button{border:1px solid #ffffff33;background:#ffffff12;color:#fff;padding:9px 11px;border-radius:9px;font-weight:700}
nav button.active{background:#ffffff28}.sync{font-size:12px;font-weight:800}.main{max-width:1600px;margin:auto;padding:18px}
.note{padding:10px 12px;border-radius:11px;background:#fff8e8;border:1px solid #efd79b;color:#684b00;margin-bottom:14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}.kpi,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 24px #123a7010}.kpi{padding:13px}.kpi span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.kpi strong{display:block;font-size:25px;margin-top:4px;color:var(--b)}
.panel{margin-top:14px;overflow:hidden}.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.ph h2{font-size:16px;margin:0}.pb{padding:15px}
.cands{display:grid;grid-template-columns:repeat(6,minmax(165px,1fr));gap:10px}.cand{border:1px solid var(--line);border-radius:13px;padding:10px;position:relative}.cand .photo{width:54px;height:54px;border-radius:12px;object-fit:cover}.cand .logo{position:absolute;right:9px;top:9px;width:33px;height:33px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:7px;padding:2px}.cand b{display:block;margin-top:7px}.cand small{color:var(--muted)}.cand .votes{font-size:25px;font-weight:900;color:var(--b);margin-top:8px}.pct{font-size:12px;font-weight:800;color:var(--m)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select,input.vote{border:1px solid #cdd8e6;border-radius:8px;padding:7px;background:#fff}.toolbar input{min-width:190px}.tablewrap{overflow:auto;max-height:calc(100vh - 220px)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}th,td{padding:7px;border-right:1px solid #e7edf4;border-bottom:1px solid #e7edf4;text-align:center;background:#fff}th{position:sticky;top:0;background:#103c72;color:#fff;z-index:3}td.local{text-align:left;min-width:200px}.vote{width:68px;text-align:center;background:#fffbe9}.person{width:165px}.mesa{width:90px;font-weight:800}.vote:disabled{background:#f0f3f7;color:#76869a}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}
.links td{text-align:left}.copy{border:1px solid #cad6e4;background:#fff;color:var(--b);padding:6px 8px;border-radius:8px;font-weight:700}
.hidden{display:none}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.cands{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><b>🗳️ Conteo Municipal · El Carmen</b><small>Chincha, Ica · conteo local no oficial</small></div>
<nav id="nav"></nav><span class="sync" id="sync">Conectando…</span><button id="admin">Administrador</button></div></header>
<main class="main" id="app"></main><div class="footer">Herramienta privada de registro y consolidación. No reemplaza resultados oficiales.</div>
<script>
const CANDS=[
{id:'goyoneche',name:'Antonio Goyoneche',party:'Progresemos Perú',photo:'/assets/antonio_goyoneche.jpg',logo:'/assets/progresemos.png'},
{id:'quincho',name:'Antonio Quincho',party:'Somos Perú',photo:'/assets/antonio_quincho.jpg',logo:'/assets/somos_peru.png'},
{id:'huaman',name:'Gerald Huaman',party:'Alianza Para el Progreso',photo:'/assets/gerald_huaman.jpg',logo:'/assets/app.png'},
{id:'hurtado',name:'Liz Hurtado',party:'Acción Popular',photo:'/assets/liz_hurtado.jpg',logo:'/assets/accion_popular.png'},
{id:'yovera',name:'Santiago Yovera',party:'Podemos Perú',photo:'/assets/santiago_yovera.jpg',logo:'/assets/podemos_peru.png'},
{id:'herrera',name:'Victor Herrera',party:'Renovación Popular',photo:'/assets/victor_herrera.jpg',logo:'/assets/renovacion_popular.png'}];
let state=null,tab='dashboard',adminPin=sessionStorage.getItem('ec_admin')||'',isAdmin=false;
const q=new URLSearchParams(location.search),ACCESS=q.get('mesa')||'',TOKEN=q.get('token')||'';
if(ACCESS&&TOKEN)tab='conteo';
const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('es-PE').format(Math.round(+n||0)), pct=n=>((+n||0)*100).toFixed(2)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function calc(t){const valid=Object.values(t.votes||{}).reduce((a,b)=>a+(+b||0),0),total=valid+(+t.blank||0)+(+t.null||0);let status='OK',kind='ok';if(!total){status='Sin datos';kind=''}else if(total>t.eligible){status='Supera hábiles';kind='bad'}else if(total>t.estimate){status='Sobre estimado';kind='warn'}return{valid,total,status,kind}}
function totals(){const cand=Object.fromEntries(CANDS.map(c=>[c.id,0]));let eligible=0,estimated=0,valid=0,total=0,processed=0,blank=0,nul=0;for(const t of state.tables){eligible+=t.eligible;estimated+=+t.estimate||0;const x=calc(t);valid+=x.valid;total+=x.total;if(x.total)processed++;blank+=+t.blank||0;nul+=+t.null||0;for(const c of CANDS)cand[c.id]+=+t.votes[c.id]||0}return{cand,eligible,estimated,valid,total,processed,blank,nul}}
function nav(){const items=[['dashboard','Visión general'],['conteo','Conteo de mesas'],['locales','Resumen por local']];if(isAdmin)items.push(['config','Configuración']);$('#nav').innerHTML=items.map(([id,n])=>'<button class="'+(tab===id?'active':'')+'" data-tab="'+id+'">'+n+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function kpi(a,b){return '<div class="kpi"><span>'+a+'</span><strong>'+b+'</strong></div>'}
function dashboard(){const t=totals(),rank=CANDS.map(c=>({...c,v:t.cand[c.id],p:t.valid?t.cand[c.id]/t.valid:0})).sort((a,b)=>b.v-a.v);return '<div class="note">Los porcentajes se calculan sobre votos válidos ingresados. Este panel es un conteo interno, no un resultado oficial.</div><div class="kpis">'+kpi('Mesas con datos',t.processed+' / '+state.tables.length)+kpi('Electores hábiles',fmt(t.eligible))+kpi('Votantes estimados',fmt(t.estimated))+kpi('Votos ingresados',fmt(t.total))+kpi('Votos válidos',fmt(t.valid))+kpi('Avance',pct(t.estimated?t.total/t.estimated:0))+'</div><section class="panel"><div class="ph"><h2>Votos acumulados por candidato</h2></div><div class="pb cands">'+rank.map(c=>'<div class="cand"><img class="photo" src="'+c.photo+'"><img class="logo" src="'+c.logo+'"><b>'+esc(c.name)+'</b><small>'+esc(c.party)+'</small><div class="votes">'+fmt(c.v)+'</div><div class="pct">'+pct(c.p)+' de válidos</div></div>').join('')+'</div></section>'}
function canEdit(t){return isAdmin||(ACCESS&&TOKEN&&t.id===ACCESS)}
function row(t){const x=calc(t),dis=canEdit(t)?'':'disabled',disEst=isAdmin?'':'disabled';return '<tr data-local="'+esc(t.local)+'" data-mesa="'+esc(t.mesa)+'" data-person="'+esc(t.personero||'')+'"><td><input class="vote mesa" data-mesa="'+t.id+'" value="'+esc(t.mesa)+'" '+dis+'></td><td><input class="vote person" data-person="'+t.id+'" value="'+esc(t.personero||'')+'" '+dis+'></td><td class="local">'+esc(t.local)+'</td><td>'+t.eligible+'</td><td>'+t.refVoters+'</td><td><input class="vote" type="number" data-est="'+t.id+'" value="'+t.estimate+'" '+disEst+'></td>'+CANDS.map(c=>'<td><input class="vote" type="number" min="0" data-vote="'+t.id+'|'+c.id+'" value="'+(+t.votes[c.id]||0)+'" '+dis+'></td>').join('')+'<td><input class="vote" type="number" data-blank="'+t.id+'" value="'+(+t.blank||0)+'" '+dis+'></td><td><input class="vote" type="number" data-null="'+t.id+'" value="'+(+t.null||0)+'" '+dis+'></td><td data-valid="'+t.id+'"><b>'+x.valid+'</b></td><td data-total="'+t.id+'"><b>'+x.total+'</b></td><td class="status '+x.kind+'" data-status="'+t.id+'">'+x.status+'</td></tr>'}
function conteo(){const rows=ACCESS&&!isAdmin?state.tables.filter(t=>t.id===ACCESS):state.tables;const note=isAdmin?'Modo administrador: puedes editar todas las mesas.':ACCESS&&TOKEN?'Acceso de personero: solo puedes modificar tu mesa.':'Vista pública de solo lectura.';return '<div class="note">'+note+'</div><section class="panel"><div class="ph"><div><h2>Conteo de mesas</h2></div><div class="toolbar"><select id="local"><option>Todos</option>'+[...new Set(state.tables.map(t=>t.local))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><input id="search" placeholder="Buscar mesa o personero"></div></div><div class="tablewrap"><table><thead><tr><th>N° mesa</th><th>Personero</th><th>Local</th><th>Hábiles</th><th>Ref.</th><th>Estimado</th>'+CANDS.map(c=>'<th>'+esc(c.name)+'</th>').join('')+'<th>Blancos</th><th>Nulos</th><th>Válidos</th><th>Total</th><th>Control</th></tr></thead><tbody>'+rows.map(row).join('')+'</tbody></table></div></section>'}
function locales(){const map={};for(const t of state.tables){if(!map[t.local])map[t.local]={tables:0,eligible:0,estimated:0,total:0,valid:0,c:Object.fromEntries(CANDS.map(c=>[c.id,0]))};const a=map[t.local],x=calc(t);a.tables++;a.eligible+=t.eligible;a.estimated+=t.estimate;a.total+=x.total;a.valid+=x.valid;for(const c of CANDS)a.c[c.id]+=+t.votes[c.id]||0}return '<section class="panel"><div class="ph"><h2>Resumen por local</h2></div><div class="pb">'+Object.entries(map).map(([n,a])=>'<h3>'+esc(n)+'</h3><div class="kpis">'+kpi('Mesas',a.tables)+kpi('Hábiles',fmt(a.eligible))+kpi('Estimados',fmt(a.estimated))+kpi('Ingresados',fmt(a.total))+kpi('Válidos',fmt(a.valid))+kpi('Avance',pct(a.estimated?a.total/a.estimated:0))+'</div><br>').join('')+'</div></section>'}
async function links(){const box=$('#links');box.textContent='Generando…';const r=await fetch('/api/admin-links',{headers:{'x-admin-pin':adminPin}}),j=await r.json();if(!r.ok){box.textContent=j.error;return}box.innerHTML='<div class="tablewrap"><table class="links"><thead><tr><th>Mesa</th><th>Local</th><th>Acceso</th></tr></thead><tbody>'+j.links.map(x=>{const u=location.origin+location.pathname+'?mesa='+encodeURIComponent(x.id)+'&token='+encodeURIComponent(x.token);return '<tr><td>'+x.id+'</td><td>'+esc(x.local)+'</td><td><button class="copy" data-copy="'+esc(u)+'">Copiar enlace</button></td></tr>'}).join('')+'</tbody></table></div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copiado'})}
function config(){return '<div class="kpis">'+kpi('Factor de participación',pct(state.election.scenarioFactor))+'</div><section class="panel"><div class="ph"><h2>Configuración</h2></div><div class="pb"><label>Factor municipal (%): <input id="factor" type="number" min="50" max="130" value="'+Math.round(state.election.scenarioFactor*100)+'"></label> <button class="copy" id="saveFactor">Guardar</button></div></section><section class="panel"><div class="ph"><h2>Enlaces para personeros</h2><button class="copy" id="genLinks">Mostrar enlaces</button></div><div class="pb" id="links">Cada enlace permite editar solo una mesa.</div></section>'}
function render(){nav();$('#app').innerHTML=tab==='dashboard'?dashboard():tab==='conteo'?conteo():tab==='locales'?locales():config();bind()}
function status(s){$('#sync').textContent=s}
let timers={};
function queue(t){if(!canEdit(t))return;clearTimeout(timers[t.id]);status('Guardando…');timers[t.id]=setTimeout(()=>saveMesa(t),500)}
async function saveMesa(t){const body={id:t.id,mesa:t.mesa,personero:t.personero,votes:t.votes,blank:t.blank,null:t.null};if(isAdmin)body.estimate=t.estimate;else body.token=TOKEN;const h={'Content-Type':'application/json'};if(isAdmin)h['x-admin-pin']=adminPin;try{const r=await fetch('/api/state',{method:'POST',headers:h,body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||'Error');status('Guardado')}catch(e){status('Error');alert(e.message)}}
function refresh(t){const x=calc(t);const a=document.querySelector('[data-valid="'+t.id+'"]'),b=document.querySelector('[data-total="'+t.id+'"]'),c=document.querySelector('[data-status="'+t.id+'"]');if(a)a.innerHTML='<b>'+x.valid+'</b>';if(b)b.innerHTML='<b>'+x.total+'</b>';if(c){c.textContent=x.status;c.className='status '+x.kind}}
function bind(){if(tab==='conteo'){document.querySelectorAll('[data-mesa]').forEach(e=>e.oninput=()=>{const t=state.tables.find(x=>x.id===e.dataset.mesa);t.mesa=e.value;queue(t)});document.querySelectorAll('[data-person]').forEach(e=>e.oninput=()=>{const t=state.tables.find(x=>x.id===e.dataset.person);t.personero=e.value;queue(t)});document.querySelectorAll('[data-vote]').forEach(e=>e.oninput=()=>{const [id,c]=e.dataset.vote.split('|'),t=state.tables.find(x=>x.id===id);t.votes[c]=Math.max(0,+e.value||0);refresh(t);queue(t)});document.querySelectorAll('[data-blank]').forEach(e=>e.oninput=()=>{const t=state.tables.find(x=>x.id===e.dataset.blank);t.blank=Math.max(0,+e.value||0);refresh(t);queue(t)});document.querySelectorAll('[data-null]').forEach(e=>e.oninput=()=>{const t=state.tables.find(x=>x.id===e.dataset.null);t.null=Math.max(0,+e.value||0);refresh(t);queue(t)});document.querySelectorAll('[data-est]').forEach(e=>e.oninput=()=>{const t=state.tables.find(x=>x.id===e.dataset.est);t.estimate=Math.max(0,+e.value||0);refresh(t);queue(t)});$('#local').onchange=filter;$('#search').oninput=filter}if(tab==='config'){ $('#genLinks').onclick=links;$('#saveFactor').onclick=saveFactor}}
function filter(){const l=$('#local').value,s=$('#search').value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('hidden',!((l==='Todos'||r.dataset.local===l)&&(!s||r.dataset.mesa.toLowerCase().includes(s)||r.dataset.person.toLowerCase().includes(s)))))}
async function saveFactor(){const f=Math.max(.5,Math.min(1.3,(+$('#factor').value||100)/100));const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':adminPin},body:JSON.stringify({kind:'config',scenarioFactor:f})}),j=await r.json();if(!r.ok)return alert(j.error);await sync()}
async function sync(){try{status('Sincronizando…');const r=await fetch('/api/state',{cache:'no-store'});state=await r.json();status('Sincronizado');render()}catch{status('Sin conexión')}}
async function adminLogin(){const p=prompt('PIN de administrador:');if(!p)return;const r=await fetch('/api/admin-links',{headers:{'x-admin-pin':p}});if(!r.ok)return alert('PIN incorrecto');adminPin=p;isAdmin=true;sessionStorage.setItem('ec_admin',p);tab='dashboard';render()}
$('#admin').onclick=()=>isAdmin?(isAdmin=false,adminPin='',sessionStorage.removeItem('ec_admin'),render()):adminLogin();
async function restore(){if(!adminPin)return;const r=await fetch('/api/admin-links',{headers:{'x-admin-pin':adminPin}});if(r.ok)isAdmin=true;else{adminPin='';sessionStorage.removeItem('ec_admin')}}
(async()=>{await restore();await sync();setInterval(()=>{if(document.activeElement?.tagName!=='INPUT')sync()},15000)})();
</script></body></html>
